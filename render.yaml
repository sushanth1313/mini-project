services:
  - type: web
    name: slv-gis-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: REQUIRE_MONGODB
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: karnataka_land_due_diligence
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: slv-gis-db
          property: connectionString
      - key: OVERPASS_URL
        value: https://overpass-api.de/api/interpreter
      - key: OVERPASS_TIMEOUT
        value: "45"

databases:
  - name: slv-gis-db
    plan: free
    databaseName: smart_land_eval
    user: slv_gis_user
